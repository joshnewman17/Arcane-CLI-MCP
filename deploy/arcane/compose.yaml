# Arcane GitOps deployment (project: arcane-cli-mcp).
#
# Arcane syncs this file from git. The image is built by GitHub Actions
# (.github/workflows/image.yml) and pulled from GHCR, so nothing is built on the host.
#
# Configuration comes from the project's .env in Arcane: non-secret defaults are
# merged in from .env.git next to this file, and ARCANE_URL / ARCANE_API_KEY /
# MCP_AUTH_TOKEN are entered in the Arcane UI (never committed).
services:
  arcane-cli-mcp:
    image: ghcr.io/joshnewman17/arcane-mcp:latest
    container_name: arcane-cli-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      AUDIT_LOG_PATH: /data/audit.log
    ports:
      - "${MCP_HOST_PORT:-8090}:8080"
    volumes:
      - data:/data
    # The CLI config holding the API key is written to /tmp at startup; keep it in memory.
    tmpfs:
      - /tmp:mode=1777,size=16m
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  data:
